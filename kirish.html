<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish Djami Lessons</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .role-body{
    --v2-blue:#2F6FED; --v2-blue-deep:#1E54C4; --v2-navy:#0E1836; --v2-line:#E3E8F2; --v2-soft:#F8FAFE;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:
      radial-gradient(900px 520px at 8% 0%, rgba(47,111,237,.11), transparent 60%),
      radial-gradient(800px 520px at 100% 100%, rgba(124,92,252,.09), transparent 60%),
      #F3F6FC;
  }
  .role-wrap{ width:100%; max-width: 480px; text-align:center; }
  .role-wrap .brand{ justify-content:center; display:inline-flex; margin-bottom: 1.4em; text-decoration:none; color:var(--v2-navy); }
  .role-card-box{
    background:#fff; border-radius:24px;
    box-shadow:0 34px 60px -30px rgba(14,24,54,.38), 0 2px 6px rgba(14,24,54,.06);
    padding: 2.4em 2.2em 2.6em;
  }
  .role-card-box h1{ font-size:1.5rem; font-weight:800; letter-spacing:-.015em; color:var(--v2-navy); margin-bottom:.25em; }
  .role-card-box > p{ color:#6B7487; margin-bottom: 1.6em; }
  .role-choice-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .role-guest-btn{
    display:flex; align-items:center; justify-content:center; gap:.5em;
    width:100%; margin-top:1em; padding:.85em 1em;
    border: 1.5px dashed #C9D5EE; border-radius:14px;
    background: transparent; cursor:pointer; color:#5B6472;
    font-size:.92rem; font-weight:600; text-decoration:none;
    transition: border-color .18s, color .18s, background .18s;
  }
  .role-guest-btn:hover{ border-color:var(--v2-blue); color:var(--v2-blue); background:rgba(47,111,237,.05); }
  .role-choice{
    display:flex; flex-direction:column; align-items:center; gap:.5em;
    border: 1.5px solid var(--v2-line); border-radius:16px;
    padding: 1.6em 1em 1.4em; cursor:pointer; background:var(--v2-soft);
    transition: border-color .18s, transform .18s, box-shadow .18s, background .18s;
    text-decoration:none; color:var(--v2-navy);
  }
  .role-choice:hover{ border-color:var(--v2-blue); background:#fff; transform: translateY(-3px); box-shadow:0 16px 30px -18px rgba(47,111,237,.55); }
  .role-choice:focus-visible{ outline:2px solid var(--v2-blue); outline-offset:2px; }
  .role-choice.is-selected{ border-color:var(--v2-blue); background:rgba(47,111,237,.07); }
  .role-choice-icon{
    width: 56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size: 1.5rem; background: rgba(47,111,237,.12); color:var(--v2-blue);
  }
  .role-choice:nth-child(2) .role-choice-icon{ background: rgba(124,92,252,.13); color:#7C5CFC; }
  .role-choice-title{ font-weight:800; font-size: 1.02rem; }
  .role-choice-sub{ font-size:.8rem; color:#6B7487; margin:0; }
  .role-continue-row{ margin-top: 1.8em; }
  .role-signin-row{ margin-top: 1.4em; font-size:.88rem; color:#6B7487; line-height:1.6; }
  .role-signin-row a{ color:var(--v2-blue); font-weight:700; text-decoration:none; }
  .role-signin-row a:hover{ color:var(--v2-blue-deep); text-decoration:underline; }
</style>
<script>
  window.vmtrcq = window.vmtrcq || [];
  window.vmtrc = window.vmtrc || function (){window.vmtrcq.push(Array.prototype.slice.call(arguments))};
</script>
<script defer src="https://cdn.vemetric.com/main.js" data-token="CHdcoB75KN2xKaYh"></script>
</head>
<body class="role-body">

<div class="role-wrap">
  <a href="index.html" class="brand"><span class="brand-mark brand-mark-logo" data-site-logo><img src="assets/logo.png" alt="Djami Lessons"></span><span data-site-brand-name>Djami Lessons</span></a>

  <div class="role-card-box">
    <h1 id="roleHeading">Siz kim sifatida kirmoqchisiz?</h1>
    <p id="roleSub">Davom etish uchun profilingiz turini tanlang.</p>

    <div class="role-choice-grid">
      <a href="student/login.html" class="role-choice" id="roleStudent">
        <span class="role-choice-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.4 2.7 3 6 3s6-1.6 6-3v-5"/><path d="M22 10v6"/></svg></span>
        <span class="role-choice-title">Talaba</span>
        <p class="role-choice-sub">O‘qish jarayonini kuzatish</p>
      </a>
      <a href="parent/login.html" class="role-choice" id="roleParent">
        <span class="role-choice-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 20v-1.5A4.5 4.5 0 0 1 7.5 14h3a4.5 4.5 0 0 1 4.5 4.5V20"/><circle cx="17.5" cy="9" r="2.3"/><path d="M17 14h1a4 4 0 0 1 4 4v2"/></svg></span>
        <span class="role-choice-title">Ota-Ona</span>
        <p class="role-choice-sub">Farzandingiz ta’limini kuzatish</p>
      </a>
    </div>

    <a href="guest/login.html" class="role-guest-btn" id="roleGuest">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg> Mehmon sifatida kirish
    </a>

    <p class="role-signin-row" id="roleSigninRow">
      Hisobingiz yo‘qmi? <a href="student/register.html">Talaba sifatida</a> yoki
      <a href="parent/register.html">Ota-ona sifatida</a> ro‘yxatdan o‘ting.
    </p>
  </div>
</div>

<script>
  // index.html'dagi "Ro'yxatdan o'tish" va "Kirish" tugmalari shu sahifaga
  // ?mode=register yoki ?mode=login bilan yo'naltiradi. Shunga qarab Talaba
  // / Ota-ona tanlovlari ro'yxatdan o'tish yoki kirish sahifasiga o'tkaziladi
  // — ilgari ikkalasi ham har doim kirish sahifasiga yo'naltirar edi.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var mode = params.get('mode') === 'register' ? 'register' : 'login';

    var roleStudent = document.getElementById('roleStudent');
    var roleParent = document.getElementById('roleParent');
    var heading = document.getElementById('roleHeading');
    var sub = document.getElementById('roleSub');
    var signinRow = document.getElementById('roleSigninRow');

    if (mode === 'register') {
      roleStudent.href = 'student/register.html';
      roleParent.href = 'parent/register.html';
      heading.textContent = 'Siz kim sifatida ro‘yxatdan o‘tmoqchisiz?';
      sub.textContent = 'Davom etish uchun profilingiz turini tanlang.';
      signinRow.innerHTML = 'Hisobingiz bormi? <a href="student/login.html">Talaba sifatida</a> yoki ' +
        '<a href="parent/login.html">Ota-ona sifatida</a> kiring.';
    }
  })();
</script>

<div class="powered-by">
  <span>powered by <b>Djami</b></span>
</div>

</body>
</html>
