<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ota-ona kirish — Djami Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="auth-body">

<div class="auth-wrap auth-wrap-split">
  <div class="auth-split">

    <div class="auth-split-left">
      <a href="../index.html" class="auth-home-btn">← Bosh sahifa</a>
      <a href="../index.html" class="brand"><span class="brand-mark brand-mark-logo" data-site-logo><img src="../assets/logo.png" alt="Djami Lessons"></span><span data-site-brand-name>Djami Lessons</span></a>

      <div class="auth-split-hero">
        <h2>Assalomu alaykum!</h2>
        <p>Farzandingizning ta’lim jarayoni haqidagi ma’lumotlarga yana bir qadam qoldi.</p>
      </div>

      <p class="auth-split-foot">Hisobingiz yo‘qmi? <a href="register.html">Ro‘yxatdan o‘ting</a></p>
    </div>

    <div class="auth-split-right">
      <h1 class="auth-title">Ota-ona profiliga kirish</h1>
      <p class="auth-sub">Email va parolingizni kiriting.</p>

      <form class="auth-form" id="parentLoginForm">
        <label class="field">
          <span>Email</span>
          <input type="email" id="loginEmail" required autocomplete="username">
        </label>
        <label class="field">
          <span>Parol</span>
          <div class="password-field">
            <input type="password" id="loginPassword" required autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle">Ko‘rsatish</button>
          </div>
        </label>

        <div class="auth-remember-row">
          <label><input type="checkbox" id="keepLoggedIn" checked> Meni eslab qol</label>
          <a href="#" class="auth-forgot" id="forgotPasswordLink">Parolni unutdingizmi?</a>
        </div>

        <p class="form-error" id="loginError" role="alert" hidden></p>
        <p class="form-notice" id="loginNotice" role="status" hidden></p>

        <button type="submit" class="btn btn-amber auth-submit" id="loginSubmit">Kirish</button>
      </form>

      <p class="auth-split-foot" style="margin-top:1.4em; color:var(--gray);">Talaba sifatida kirmoqchimisiz? <a href="../student/login.html">Shu yerga o‘ting</a></p>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../site-settings.js"></script>
<script>

document.getElementById('pwToggle').addEventListener('click', () => {
  const input = document.getElementById('loginPassword');
  const btn = document.getElementById('pwToggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Yashirish' : 'Ko‘rsatish';
});

// Agar oldin "Meni eslab qol" belgilangan bo'lsa, Firebase brauzerda
// sessiyani saqlab qoladi. Shunday holatda ota-onani qayta email/parol
// so'ramasdan avtomatik ravishda dashboard'ga o'tkazamiz.
const authForm = document.getElementById('parentLoginForm');
const autoLoginNotice = document.getElementById('loginNotice');
auth.onAuthStateChanged(async (user) => {
  if(!user) return;
  try{
    const parentDoc = await db.collection('parents').doc(user.uid).get();
    if(parentDoc.exists){
      authForm.hidden = true;
      autoLoginNotice.textContent = 'Avvalgi profilingizga avtomatik kirilmoqda…';
      autoLoginNotice.hidden = false;
      window.location.href = 'dashboard.html';
    }
    // Agar bu hisob ota-ona sifatida ro'yxatdan o'tmagan bo'lsa (masalan,
    // talaba sifatida kirgan), forma oddiy holatda ko'rsatilaveradi.
  } catch(e){ /* silent — forma ko'rsatilaveradi */ }
});

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  const noticeEl = document.getElementById('loginNotice');
  const submitBtn = document.getElementById('loginSubmit');
  errorEl.hidden = true;
  noticeEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Tekshirilmoqda…';

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const keepLoggedIn = document.getElementById('keepLoggedIn').checked;

  try{
    await auth.setPersistence(
      keepLoggedIn ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION
    );
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const parentDoc = await db.collection('parents').doc(cred.user.uid).get();
    if(!parentDoc.exists){
      await auth.signOut();
      errorEl.textContent = 'Bu hisob ota-ona sifatida ro‘yxatdan o‘tmagan.';
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kirish';
      return;
    }
    // Faollik jurnaliga yozish
    try {
      await db.collection('activity_log').add({
        role: 'parent',
        action: 'login',
        uid: cred.user.uid,
        name: parentDoc.data().parentName || cred.user.email || '—',
        email: cred.user.email || '—',
        at: firebase.firestore.FieldValue.serverTimestamp(),
        ua: navigator.userAgent
      });
    } catch(e){ /* silent */ }
    window.location.href = 'dashboard.html';
  } catch(err){
    errorEl.textContent = 'Email yoki parol noto‘g‘ri.';
    errorEl.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Kirish';
  }
});

document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  const noticeEl = document.getElementById('loginNotice');
  errorEl.hidden = true;
  noticeEl.hidden = true;

  const email = document.getElementById('loginEmail').value.trim();
  if(!email){
    errorEl.textContent = 'Parolni tiklash uchun avval email manzilingizni kiriting.';
    errorEl.hidden = false;
    return;
  }

  try{
    await auth.sendPasswordResetEmail(email);
    noticeEl.textContent = 'Parolni tiklash havolasi ' + email + ' manziliga yuborildi.';
    noticeEl.hidden = false;
  } catch(err){
    errorEl.textContent = 'Havolani yuborib bo‘lmadi. Email manzilni tekshirib, qayta urinib ko‘ring.';
    errorEl.hidden = false;
  }
});
</script>
</body>
</html>
