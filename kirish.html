<style>
  /* Variant B: qora-oq minimal. Orqa fon admin panel "Oddiy fon" rejimi bilan bir xil (pastdagi blok). */
  .role-body{
    --v2-navy:#000; --v2-line:#000;
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:clamp(24px,6vh,64px) 22px 90px;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color:#000;
  }
  .role-wrap{ width:100%; max-width:440px; text-align:left; }
  .role-wrap .brand{ display:inline-flex; align-items:center; gap:.6em; margin-bottom:2.6em; font-size:.95rem; text-decoration:none; color:#000; font-weight:800; }
  .role-card-box{ background:transparent; box-shadow:none; padding:0; border-radius:0; }
  /* glass-auth.css dan keladigan oq shisha karta/soya/xiralashtirishni o'chiramiz */
  .role-wrap .role-card-box{ background:transparent !important; box-shadow:none !important; border:0 !important; padding:0 !important; border-radius:0 !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important; }
  .role-wrap::before, .role-wrap::after, .role-wrap .role-card-box::before, .role-wrap .role-card-box::after{ display:none !important; content:none !important; }
  .role-card-box h1{ font-size:1.9rem; font-weight:800; letter-spacing:-.035em; line-height:1.08; color:#000; margin:0 0 .3em; }
  .role-card-box > p{ color:#000; opacity:.6; font-size:.9rem; margin:0 0 1.8em; }
  .role-choice-grid{ display:flex; flex-direction:column; gap:12px; }
  .role-wrap .role-choice{
    display:flex; flex-direction:row; align-items:center; gap:14px; text-align:left;
    padding:.95em 1.1em; border-radius:16px; text-decoration:none; cursor:pointer;
    background:#000 !important; color:#fff !important; border:1.5px solid #000 !important;
    box-shadow:0 8px 18px -8px rgba(0,0,0,.55);
    transition:transform .18s, box-shadow .18s, background .18s;
  }
  .role-wrap .role-choice + .role-choice{ background:#fff !important; color:#000 !important; box-shadow:none; }
  .role-wrap .role-choice:hover{ transform:translateY(-2px); box-shadow:0 14px 26px -12px rgba(0,0,0,.5); }
  .role-wrap .role-choice:focus-visible{ outline:2px solid #000; outline-offset:3px; }
  .role-choice-icon{ width:auto !important; height:auto !important; background:transparent !important; color:inherit !important; border-radius:0; display:flex; align-items:center; flex-shrink:0; }
  .role-choice-text{ flex:1; display:flex; flex-direction:column; gap:2px; }
  .role-choice-title{ font-weight:800; font-size:.98rem; color:inherit; }
  .role-choice-sub{ font-size:.74rem; margin:0; color:inherit; opacity:.7; }
  .role-choice-arrow{ flex-shrink:0; opacity:.9; }
  .role-guest-btn{
    display:block; width:auto; margin:3em auto 0; padding:.4em; border:0; background:transparent;
    color:#000; font-size:.86rem; font-weight:700; text-decoration:underline; text-align:center; cursor:pointer;
  }
  .role-guest-btn:hover{ opacity:.65; }
  .role-signin-row{ margin-top:3.2em; font-size:.8rem; color:#000; opacity:.7; line-height:1.6; text-align:center; }
  .role-signin-row a{ color:#000; font-weight:800; text-decoration:underline; }
  .role-signin-row a:hover{ opacity:.7; }
  .powered-by{ position:fixed; left:0; right:0; bottom:14px; text-align:center; }
</style>

<div class="role-wrap" style="background:transparent !important;box-shadow:none !important;border:0 !important;border-radius:0 !important;-webkit-backdrop-filter:none !important;backdrop-filter:none !important;">
  <a href="./" class="brand"><span class="brand-mark brand-mark-logo" data-site-logo><img src="assets/logo.png" alt="Djami Lessons"></span><span data-site-brand-name>Djami Lessons</span></a>

  <!-- ===== Djami mascot: gapiradigan yordamchi ===== -->
  <style>
    .role-wrap{ position:relative; }
    .dj-bot{ position:absolute; left:calc(100% + 48px); top:-10px; width:250px; z-index:5;
      display:flex; flex-direction:column; align-items:center; }
    .dj-bubble{ position:relative; width:100%; background:#fff; color:#000; border:1.5px solid #000; border-radius:18px;
      padding:14px 16px 14px; box-shadow:0 12px 26px -16px rgba(0,0,0,.5);
      opacity:0; transform:translateY(8px) scale(.96); transform-origin:50% 100%;
      transition:opacity .3s, transform .3s; }
    .dj-bot.is-on .dj-bubble{ opacity:1; transform:none; }
    .dj-bubble::after{ content:""; position:absolute; left:50%; bottom:-8.5px; width:14px; height:14px; margin-left:-7px;
      background:#fff; border-right:1.5px solid #000; border-bottom:1.5px solid #000; transform:rotate(45deg); }
    .dj-text{ position:relative; font-size:.9rem; font-weight:600; line-height:1.45; letter-spacing:-.005em; }
    .dj-text .dj-ghost{ visibility:hidden; display:block; }
    .dj-text .dj-typed{ position:absolute; inset:0; display:block; }
    .dj-caret{ display:inline-block; width:2px; height:1em; margin-left:1px; vertical-align:-.12em; background:currentColor; animation:djCaret .8s steps(1) infinite; }
    .dj-bot.is-done .dj-caret{ display:none; }
    @keyframes djCaret{ 50%{ opacity:0 } }
    .dj-tg{ display:inline-flex; align-items:center; gap:.5em; margin-top:12px; padding:.55em .95em; border-radius:999px;
      background:#000; color:#fff; font-size:.82rem; font-weight:800; text-decoration:none;
      opacity:0; transform:translateY(4px); pointer-events:none; transition:opacity .3s, transform .3s, background .18s; }
    .dj-bot.is-done .dj-tg{ opacity:1; transform:none; pointer-events:auto; }
    .dj-tg:hover{ background:#229ed9; }
    .dj-tg:focus-visible{ outline:2px solid #000; outline-offset:3px; }
    .dj-x{ display:none; position:absolute; top:4px; right:6px; width:22px; height:22px; border:0; background:transparent;
      color:inherit; opacity:.5; font-size:18px; line-height:1; cursor:pointer; }
    .dj-x:hover{ opacity:1; }

    .dj-mascot{ position:relative; width:150px; margin-top:6px; cursor:grab; touch-action:pan-y;
      user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;
      transform-origin:50% 92%; transition:transform .6s cubic-bezier(.34,1.56,.64,1); }
    .dj-mascot.is-drag{ transition:none; cursor:grabbing; }
    .dj-mascot:focus-visible{ outline:2px solid #5b72f0; outline-offset:4px; border-radius:24px; }
    .dj-float{ animation:djFloat 3.2s ease-in-out infinite; }
    @keyframes djFloat{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-5px) } }
    .dj-shade{ width:62%; height:8px; margin:3px auto 0; border-radius:50%; background:rgba(28,42,107,.18); filter:blur(3px);
      animation:djShadow 3.2s ease-in-out infinite; }
    @keyframes djShadow{ 0%,100%{ transform:scaleX(1); opacity:1 } 50%{ transform:scaleX(.82); opacity:.6 } }
    .dj-svg{ display:block; width:100%; height:auto; pointer-events:none; overflow:visible; filter:drop-shadow(0 8px 10px rgba(30,60,200,.2)); }
    .dj-eye{ transform-box:fill-box; transform-origin:50% 50%; animation:djBlink 4.6s infinite; }
    .dj-lid{ opacity:0; animation:djLid 4.6s infinite; }
    @keyframes djBlink{ 0%,92%,100%{ transform:scaleY(1) } 95%{ transform:scaleY(.01) } }
    @keyframes djLid{ 0%,93%,100%{ opacity:0 } 94.5%,96%{ opacity:1 } }
    .dj-pupil{ transition:transform .14s ease-out; }
    .dj-mouth{ transform-box:fill-box; transform-origin:50% 8%; transition:transform .09s ease-out; }
    .dj-armR{ transform-box:view-box; transform-origin:880px 850px; animation:djArmIdle 3.2s ease-in-out infinite; }
    @keyframes djArmIdle{ 0%,100%{ transform:rotate(0) } 50%{ transform:rotate(-4deg) } }
    .dj-bot.is-wave .dj-armR{ animation:djArmWave .55s ease-in-out 5; }
    @keyframes djArmWave{ 0%,100%{ transform:rotate(2deg) } 50%{ transform:rotate(-13deg) } }
    .dj-bot.is-talk .dj-armR{ animation:djArmTalk .7s ease-in-out infinite; }
    @keyframes djArmTalk{ 0%,100%{ transform:rotate(0) } 50%{ transform:rotate(-9deg) } }
    .dj-fist{ transform-box:fill-box; transform-origin:50% 55%; animation:djFistIdle 3.2s ease-in-out infinite; }
    @keyframes djFistIdle{ 0%,100%{ transform:none } 50%{ transform:scale(1.025) translateY(-3px) } }
    .dj-bot.is-talk .dj-fist{ animation:djFistTalk .5s ease-in-out infinite; }
    @keyframes djFistTalk{ 0%,100%{ transform:none } 50%{ transform:scale(1.05) translateY(-7px) rotate(-3deg) } }
    body.dark .dj-bubble{ background:#0c0c0c; color:#fff; border-color:#fff; }
    body.dark .dj-bubble::after{ background:#0c0c0c; border-color:#fff; }
    body.dark .dj-tg{ background:#fff; color:#000; }

    /* Tor ekran / telefon: pastki o'ng burchakda, ixcham */
    @media (max-width:1079px){
      .dj-bot{ position:fixed; left:auto; top:auto; right:8px; bottom:30px; width:min(176px, calc(100vw - 16px)); align-items:flex-end; }
      .dj-bubble{ padding:8px 10px; border-radius:13px; }
      .dj-bubble::after{ left:auto; right:30px; margin-left:0; width:11px; height:11px; bottom:-6.5px; }
      .dj-text{ font-size:.72rem; line-height:1.35; padding-right:14px; }
      .dj-tg{ display:none; margin-top:7px; padding:.4em .7em; font-size:.7rem; }
      .dj-tg svg{ width:13px; height:13px; }
      .dj-bot.is-done .dj-tg{ display:inline-flex; }
      .dj-mascot{ width:70px; margin:3px 10px 0 0; }
      .dj-x{ display:block; top:1px; right:3px; width:20px; height:20px; font-size:16px; }
      .dj-bot.is-closed .dj-bubble{ display:none; }
    }
    @media (prefers-reduced-motion:reduce){
      .dj-float,.dj-shade,.dj-caret,.dj-eye,.dj-lid,.dj-armR,.dj-fist,.dj-bot.is-wave .dj-armR,.dj-bot.is-talk .dj-armR,.dj-bot.is-talk .dj-fist{ animation:none !important; }
    }
  </style>

  <script>
  (function () {
    var bot = document.getElementById('djBot');
    var typed = document.getElementById('djTyped');
    var mascot = document.getElementById('djMascot');
    var mouth = document.getElementById('djMouth');
    var pL = document.getElementById('djeyeL'), pR = document.getElementById('djeyeR');
    var closeBtn = document.getElementById('djClose');
    var TEXT = 'Sahifangizga kira olmayapsizmi? Adminga murojaat eting';
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var timers = [], mouthTimer = 0, run = 0;

    function clearAll() { timers.forEach(clearTimeout); timers = []; clearInterval(mouthTimer); mouth.style.transform = ''; }
    function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
    function caret() { return '<span class="dj-caret"></span>'; }

    function speak() {
      clearAll();
      var id = ++run;
      bot.classList.remove('is-done', 'is-talk', 'is-closed');
      bot.classList.add('is-on');
      typed.textContent = '';
      if (reduce) { typed.textContent = TEXT; bot.classList.add('is-done'); return; }
      bot.classList.remove('is-wave'); void bot.offsetWidth; bot.classList.add('is-wave');
      var i = 0;
      later(function step() {
        if (id !== run) return;
        if (i === 0) {
          bot.classList.add('is-talk');
          mouthTimer = setInterval(function () {
            mouth.style.transform = 'scaleY(' + (0.3 + Math.random() * 0.7).toFixed(2) + ')';
          }, 110);
        }
        i++;
        typed.innerHTML = '';
        typed.appendChild(document.createTextNode(TEXT.slice(0, i)));
        typed.insertAdjacentHTML('beforeend', caret());
        if (i >= TEXT.length) {
          later(function () {
            clearInterval(mouthTimer);
            mouth.style.transform = '';
            bot.classList.remove('is-talk');
            bot.classList.add('is-done');
            typed.textContent = TEXT;
          }, 250);
          return;
        }
        var ch = TEXT.charAt(i - 1);
        later(step, ch === '?' ? 380 : (ch === ' ' ? 55 : 42));
      }, 900);
    }

    // Ko'z qorachiqlari kursorga qarab turadi
    window.addEventListener('pointermove', function (e) {
      var r = mascot.getBoundingClientRect();
      var cx = r.left + r.width / 2, cy = r.top + r.height * 0.4;
      var dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy) || 1;
      var k = Math.min(d / 150, 1) * 14;
      var t = 'translate(' + (dx / d * k).toFixed(1) + 'px,' + (dy / d * k).toFixed(1) + 'px)';
      pL.style.transform = t; pR.style.transform = t;
    }, { passive: true });

    // Sichqoncha / barmoq bilan ushlab chapga-o'ngga burish
    var dragging = false, startX = 0, moved = false, justDragged = false;
    function turn(v) {
      mascot.style.transform = v ? 'perspective(600px) rotateY(' + (v * 34).toFixed(1) + 'deg) rotate(' + (v * -3).toFixed(1) + 'deg)' : '';
    }
    mascot.addEventListener('pointerdown', function (e) {
      dragging = true; moved = false; startX = e.clientX;
      try { mascot.setPointerCapture(e.pointerId); } catch (err) {}
      mascot.classList.add('is-drag');
    });
    mascot.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 4) moved = true;
      turn(Math.max(-1, Math.min(1, dx / 90)));
    });
    function release() {
      if (!dragging) return;
      dragging = false;
      justDragged = moved;
      setTimeout(function () { justDragged = false; }, 60);
      mascot.classList.remove('is-drag');
      turn(0);
    }
    mascot.addEventListener('pointerup', release);
    mascot.addEventListener('pointercancel', release);
    mascot.addEventListener('click', function () { if (!justDragged) speak(); });
    mascot.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); speak(); } });
    closeBtn.addEventListener('click', function () { clearAll(); bot.classList.remove('is-talk'); bot.classList.add('is-closed', 'is-done'); typed.textContent = TEXT; });

    if (document.readyState === 'complete') speak(); else window.addEventListener('load', speak);
  })();
  </script>

<script>
  // index.html'dagi "Ro'yxatdan o'tish" va "Kirish" tugmalari shu sahifaga
  // ?mode=register yoki ?mode=login bilan yo'naltiradi. Shunga qarab Talaba

  (function () {

uniform vec2 uOffset;
uniform float uCellSize;

uniform ivec2 uCells;
uniform vec3 uColor;

uniform float uLineWidth;
uniform float uMaxOpacity;
uniform float uFillOpacity;
uniform float uGridOpacity;
uniform float uCellRadius;
uniform float uCellGap;
uniform int uGridStyle;
uniform vec2 uMouse;
uniform float uRadius;
uniform float uSpotlight;
uniform float uPresence;
uniform float uEdgeFade;
uniform float uReveal;

}

      radius: Math.max(1, num(o.radius, 140)),

      }
    };
  }

  global.CursorGrid = CursorGrid;
})(window);


(function () {
  var host = document.getElementById('adminCursorGrid');
  var grid = null;
  function dark() { return document.body.classList.contains('dark'); }
  function small() { return window.innerWidth < 700; }
  function look() {
    var o = dark()
      ? { lightMode: false, color: '#9db4ff', gridColor: '#c9d6ff', gridOpacity: 0.05, fillOpacity: 0.05 }
      : { lightMode: true,  color: '#7f93ee', gridColor: '#8da0e8', gridOpacity: 0.08, fillOpacity: 0.05 };
    o.cellSize = small() ? 34 : 44;
    o.radius = small() ? 70 : 100;
    return o;
  }
  function start() {
    if (grid || !host || !window.CursorGrid) return;
    grid = CursorGrid(host, Object.assign({ highlight: 'area', gridStyle: 'lines', lineWidth: 1,
      maxOpacity: 0.35, spotlight: 0.2, holdTime: 250, fadeDuration: 700, clickPulse: true, edgeFade: 0.15 }, look()));
  }
  function stop() { if (grid) { grid.destroy(); grid = null; } }
  // mode: 'plain' (oq/qora + katak) yoki 'glass' (hozirgi shisha uslubi)
  window.setAdminBgMode = function (mode) {
    var plain = mode === 'plain';
    document.documentElement.classList.toggle('admin-bg-plain', plain);
    try { localStorage.setItem('efAdminBgMode', plain ? 'plain' : 'glass'); } catch (e) {}
    if (plain) start(); else stop();
  };
  window.addEventListener('resize', function () { if (grid) grid.update(look()); });
  new MutationObserver(function () { if (grid) grid.update(look()); })
    .observe(document.body, { attributes: true, attributeFilter: ['class'] });
  // Sahifa ochilganda saqlangan rejimni qo'llaymiz (Firestore javobi kelgach yangilanadi)
  if (document.documentElement.classList.contains('admin-bg-plain')) start();
})();
</script>
