<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  // Apply saved theme before paint to avoid a flash of the wrong mode.
  (function(){
    var saved = localStorage.getItem('ef-theme');
    if(saved === 'dark'){ document.documentElement.setAttribute('data-theme', 'dark'); }
  })();
</script>
</head>
<body class="home-body">

<div class="home-topbar">
  <a href="index.html" class="brand"><span class="brand-mark" data-site-logo></span><span data-site-brand-name>English Folder</span></a>
  <button class="theme-toggle" id="themeToggle" type="button">
    <span id="themeToggleIcon">🌙</span>
    <span id="themeToggleLabel">Tungi rejim</span>
  </button>
</div>

<main class="home-main">
  <div class="home-labels">
    <span class="home-label" data-site-home-label-1>GENERAL ENGLISH</span>
    <span class="home-label" data-site-home-label-2>IELTS</span>
    <span class="home-label" data-site-home-label-3>CEFR</span>
  </div>
<section class="home-section">
  <div class="container">
    <div id="coursesInfoContent" class="rich-content"></div>
  </div>
</section>
  <a href="student/login.html" class="btn btn-amber home-student-btn" data-site-home-student-btn>Talaba profili</a>
</main>

<div class="home-bottombar">
  <a href="admin/login.html" class="home-admin-link" data-site-home-admin-btn>Admin profili</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="site-settings.js"></script>
<script>
  const themeToggle = document.getElementById('themeToggle');
  const themeIcon = document.getElementById('themeToggleIcon');
  const themeLabel = document.getElementById('themeToggleLabel');

  function reflectTheme(){
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    themeIcon.textContent = isDark ? '☀️' : '🌙';
    themeLabel.textContent = isDark ? 'Kunduzgi rejim' : 'Tungi rejim';
  }
  reflectTheme();

  themeToggle.addEventListener('click', () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if(isDark){
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('ef-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('ef-theme', 'dark');
    }
    reflectTheme();
  });
</script>
</body>
</html>
