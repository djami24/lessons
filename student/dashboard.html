<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mening kursim — English Folder</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="loadingScreen" class="loading-screen">Yuklanmoqda…</div>

<div class="admin-shell" id="appShell" hidden>

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <a href="../index.html" class="brand"><span class="brand-mark" data-site-logo></span><span data-site-brand-name>English Folder</span></a>
    <ul class="admin-nav">
      <li><a href="#" class="active" id="navCourses">📚 Kurslarim</a></li>
      <li><a href="../index.html" target="_blank">🌐 Saytni ko‘rish</a></li>
    </ul>
    <div class="admin-user">
      <div>
        <div class="admin-user-name" id="sidebarUsername">o‘quvchi</div>
        <div class="admin-user-role">O‘quvchi</div>
      </div>
      <button class="logout-btn" id="logoutBtn">Chiqish</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <section id="view-courses">
      <div class="admin-header"><h1>Kurslarim</h1></div>
      <div class="course-grid" id="studentCoursesGrid">
        <article class="folder course-card" id="cardGeneralEnglish">
          <div class="folder-tab" style="--tab-color:#2E6F6E"></div>
          <div class="folder-body">
            <span class="tag">A1–B1</span>
            <h3 class="course-title">General English</h3>
            <p class="course-sub" id="generalEnglishSub"></p>
          </div>
        </article>
        <div id="studentDynamicCoursesArea" style="display:contents;"></div>
        <article class="folder course-card" id="cardWriting">
          <div class="folder-tab" style="--tab-color:#B3432B"></div>
          <div class="folder-body">
            <span class="tag">IELTS / CEFR</span>
            <h3 class="course-title">Writing</h3>
            <p class="course-sub" id="writingCourseSub"></p>
          </div>
        </article>
      </div>
    </section>

    <section id="view-skills" hidden>
      <a href="#" id="backToCoursesFromSkills" class="back-link">← Kurslarga qaytish</a>
      <div class="admin-header"><h1 id="skillsTitle">Mavzular</h1></div>
      <div class="level-grid" id="skillsGrid"></div>
    </section>

    <!-- LESSON DETAIL VIEW -->
    <section id="view-lesson-detail" hidden>
      <a href="#" id="backToLessons" class="back-link">← Darslar ro‘yxatiga qaytish</a>
      <div class="lesson-detail-box" id="lessonDetailBox"></div>
    </section>

    <!-- BOSHQA VIEWLAR (Lessons, Quiz, Payment, Writing...) -->
    <!-- (Eslatma: Kod hajmi uchun qisqartirildi, sizdagi eski kodlar bilan bir xil ishlaydi) -->
    <section id="view-levels" hidden><div class="level-grid" id="levelsGrid"></div></section>
    <section id="view-lessons" hidden><div class="lesson-list" id="lessonList"></div></section>
    <section id="view-quiz" hidden><div class="quiz-box"><div id="quizQuestions"></div><button class="btn btn-amber" id="submitQuizBtn">Yakunlash</button></div></section>
    <section id="view-quiz-result" hidden><div class="quiz-result-box" id="quizResultBox"></div></section>
    <!-- ... Qolgan writing va payment sectionlari ... -->
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
let activeTimer = null; // Timer uchun global o'zgaruvchi

async function openLessonDetail(lessonId){
  if (activeTimer) clearInterval(activeTimer); // Eskisini o'chirish
  state.activeLessonId = lessonId;
  const lesson = getCurrentLesson();
  
  const box = document.getElementById('lessonDetailBox');
  
  // Timer HTML qismi
  const timerHtml = (lesson.timerSeconds && lesson.timerSeconds > 0) 
    ? `<div id="lessonTimer" style="background:#ffcccc; padding:12px; margin-bottom:15px; border-radius:8px; text-align:center; font-weight:bold; color:red; border:1px solid red;">Vaqt: ${lesson.timerSeconds} sekund</div>` 
    : '';

  box.innerHTML = timerHtml + `
    <h1>${lesson.title}</h1>
    <div class="rich-content">${lesson.topicText || ''}</div>
    ${lesson.video ? `<a href="${lesson.video}" target="_blank">🎬 Video</a>` : ''}
    <button class="btn btn-amber" id="startQuizBtn">Testni boshlash</button>
  `;

  // Timer mantiqi
  if (lesson.timerSeconds && lesson.timerSeconds > 0) {
    let timeLeft = lesson.timerSeconds;
    const timerDisplay = document.getElementById('lessonTimer');
    activeTimer = setInterval(() => {
      timeLeft--;
      if (timerDisplay) timerDisplay.textContent = `Vaqt: ${timeLeft} sekund`;
      if (timeLeft <= 0) {
        clearInterval(activeTimer);
        timerDisplay.textContent = "⏰ Vaqtingiz tugadi!";
        document.getElementById('lessonDetailBox').style.pointerEvents = 'none';
        document.getElementById('lessonDetailBox').style.opacity = '0.5';
      }
    }, 1000);
  }
  switchView('lesson-detail');
}
// ... qolgan barcha funksiyalar (saveState, restoreState va h.k.) ...
</script>
</body>
</html>
