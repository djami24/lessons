<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog — Djami Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="home-body">

<div class="home-topbar">
  <a href="index.html" class="brand"><span class="brand-mark brand-mark-logo" data-site-logo><img src="assets/logo.png" alt="Djami Lessons"></span><span data-site-brand-name>Djami Lessons</span></a>
  <a href="index.html" class="home-admin-link">← Bosh sahifaga</a>
</div>

<main class="home-main" style="align-items:stretch; text-align:left;">
  <div class="blog-post-wrap" id="blogPostWrap">
    <p class="blog-post-loading" id="blogPostLoading">Yuklanmoqda…</p>
  </div>

  <div class="blog-post-wrap blog-comments-section" id="blogCommentsSection" hidden>
    <div class="blog-comments-heading-row">
      <h2 class="blog-comments-heading">Izohlar (<span id="commentCount">0</span>)</h2>
      <button type="button" class="btn btn-amber btn-sm" id="commentToggleBtn">💬 Izoh qoldirish</button>
    </div>

    <form class="blog-comment-form" id="commentForm" hidden>
      <input type="text" id="commentName" placeholder="Ismingiz (ixtiyoriy)" maxlength="60">
      <textarea id="commentText" rows="3" placeholder="Izohingizni yozing…" maxlength="1000" required></textarea>
      <div class="blog-comment-form-row">
        <p class="blog-comment-error" id="commentError" hidden></p>
        <div style="display:flex; gap:.7em;">
          <button type="button" class="btn btn-ghost btn-sm" id="commentCancelBtn">Bekor qilish</button>
          <button type="submit" class="btn btn-amber btn-sm" id="commentSubmit">Yuborish</button>
        </div>
      </div>
    </form>

    <div class="blog-comment-list" id="commentList"></div>
    <p class="blog-comments-empty" id="commentsEmpty" hidden>Hali izohlar yo‘q — birinchi bo‘lib fikr bildiring!</p>
  </div>
</main>

<div class="home-bottombar">
  <p class="home-footer-note" data-site-footer-copyright>© 2026 Djami Lessons. Barcha huquqlar himoyalangan.</p>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="site-settings.js"></script>
<script>
(function () {
  var wrap = document.getElementById('blogPostWrap');

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  function showMessage(text) {
    wrap.innerHTML = '<p class="blog-post-loading">' + escapeHtml(text) + '</p>';
  }

  async function loadBlogPost() {
    var params = new URLSearchParams(window.location.search);
    var id = params.get('id');
    if (!id) { showMessage('Blog topilmadi.'); return; }

    try {
      var doc = await db.collection('blogs').doc(id).get();
      if (!doc.exists) { showMessage('Bu blog o‘chirilgan yoki mavjud emas.'); return; }

      var b = doc.data();
      document.title = (b.title || 'Blog') + ' — Djami Lessons';

      wrap.innerHTML =
        (b.imageUrl ? '<img class="blog-post-img" src="' + escapeHtml(b.imageUrl) + '" alt="' + escapeHtml(b.title || '') + '">' : '') +
        '<h1 class="blog-post-title">' + escapeHtml(b.title || '') + '</h1>' +
        '<div class="rich-content blog-post-content">' + (b.content || '') + '</div>' +
        '<div class="blog-actions">' +
          '<div class="blog-vote-box">' +
            '<button type="button" class="blog-vote-btn" id="likeBtn">👍 <span id="likeCount">' + (b.likeCount || 0) + '</span></button>' +
            '<button type="button" class="blog-vote-btn" id="dislikeBtn">👎 <span id="dislikeCount">' + (b.dislikeCount || 0) + '</span></button>' +
          '</div>' +
          '<div class="blog-share-box">' +
            '<button type="button" class="blog-share-btn" id="shareBtn">🔗 Ulashish</button>' +
          '</div>' +
        '</div>';

      setupActions(id, b);
      setupComments(id);
    } catch (err) {
      showMessage('Blogni yuklashda xatolik yuz berdi.');
    }
  }

  /* ---- Like / dislike (one vote per browser, via localStorage) + share links ---- */
  function setupActions(id, b) {
    var VOTE_KEY = 'efBlogVote_' + id;
    var likeBtn = document.getElementById('likeBtn');
    var dislikeBtn = document.getElementById('dislikeBtn');
    var likeCountEl = document.getElementById('likeCount');
    var dislikeCountEl = document.getElementById('dislikeCount');

    var likeCount = b.likeCount || 0;
    var dislikeCount = b.dislikeCount || 0;

    function applyVotedState(vote) {
      likeBtn.disabled = true;
      dislikeBtn.disabled = true;
      if (vote === 'like') likeBtn.classList.add('is-active');
      if (vote === 'dislike') dislikeBtn.classList.add('is-active');
    }

    var storedVote = null;
    try { storedVote = localStorage.getItem(VOTE_KEY); } catch (e) {}
    if (storedVote === 'like' || storedVote === 'dislike') applyVotedState(storedVote);

    async function vote(type) {
      if (likeBtn.disabled || dislikeBtn.disabled) return;
      likeBtn.disabled = true;
      dislikeBtn.disabled = true;
      try {
        var field = type === 'like' ? 'likeCount' : 'dislikeCount';
        var update = {};
        update[field] = firebase.firestore.FieldValue.increment(1);
        await db.collection('blogs').doc(id).update(update);

        if (type === 'like') { likeCount += 1; likeCountEl.textContent = likeCount; }
        else { dislikeCount += 1; dislikeCountEl.textContent = dislikeCount; }

        try { localStorage.setItem(VOTE_KEY, type); } catch (e) {}
        applyVotedState(type);
      } catch (err) {
        likeBtn.disabled = false;
        dislikeBtn.disabled = false;
      }
    }

    likeBtn.addEventListener('click', function () { vote('like'); });
    dislikeBtn.addEventListener('click', function () { vote('dislike'); });

    var shareUrl = window.location.href;
    var shareTitle = b.title || 'Djami Lessons';

    var shareBtn = document.getElementById('shareBtn');
    var shareOriginalText = shareBtn.textContent;

    function fallbackCopy() {
      try {
        navigator.clipboard.writeText(shareUrl);
      } catch (e) {
        var tmp = document.createElement('textarea');
        tmp.value = shareUrl;
        document.body.appendChild(tmp);
        tmp.select();
        try { document.execCommand('copy'); } catch (e2) {}
        document.body.removeChild(tmp);
      }
      shareBtn.textContent = '✓ Nusxalandi';
      shareBtn.classList.add('is-copied');
      setTimeout(function () {
        shareBtn.textContent = shareOriginalText;
        shareBtn.classList.remove('is-copied');
      }, 1800);
    }

    shareBtn.addEventListener('click', async function () {
      var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile && navigator.share) {
        try {
          await navigator.share({ title: shareTitle, url: shareUrl });
          return;
        } catch (e) {
          return; // user cancelled the native share sheet
        }
      }
      fallbackCopy();
    });
  }

  /* ---- Izohlar (comments): any visitor may read and post; no login required.
     Name is optional — if left blank it's stored/shown as "Anonim". The form
     itself stays tucked away behind an "Izoh qoldirish" button until the
     reader wants to write something. Long comments collapse behind a
     "Ko'proq o'qish" toggle so the list doesn't get overwhelming. ---- */
  var COMMENT_CLAMP_LENGTH = 240;

  function setupComments(blogId) {
    var sectionEl = document.getElementById('blogCommentsSection');
    var listEl = document.getElementById('commentList');
    var emptyEl = document.getElementById('commentsEmpty');
    var countEl = document.getElementById('commentCount');
    var toggleBtn = document.getElementById('commentToggleBtn');
    var cancelBtn = document.getElementById('commentCancelBtn');
    var formEl = document.getElementById('commentForm');
    var nameEl = document.getElementById('commentName');
    var textEl = document.getElementById('commentText');
    var errorEl = document.getElementById('commentError');
    var submitBtn = document.getElementById('commentSubmit');

    var NAME_KEY = 'efCommentName';
    try {
      var savedName = localStorage.getItem(NAME_KEY);
      if (savedName) nameEl.value = savedName;
    } catch (e) {}

    function showForm() {
      formEl.hidden = false;
      toggleBtn.hidden = true;
      textEl.focus();
    }
    function hideForm() {
      formEl.hidden = true;
      toggleBtn.hidden = false;
      errorEl.hidden = true;
    }
    toggleBtn.addEventListener('click', showForm);
    cancelBtn.addEventListener('click', hideForm);

    function formatDate(ts) {
      if (!ts || typeof ts.toDate !== 'function') return '';
      var d = ts.toDate();
      return d.toLocaleDateString('uz-UZ', { day: 'numeric', month: 'short', year: 'numeric' }) +
        ' · ' + d.toLocaleTimeString('uz-UZ', { hour: '2-digit', minute: '2-digit' });
    }

    function renderComments(docs) {
      countEl.textContent = docs.length;
      if (docs.length === 0) {
        listEl.innerHTML = '';
        emptyEl.hidden = false;
        return;
      }
      emptyEl.hidden = true;
      listEl.innerHTML = docs.map(function (doc) {
        var c = doc.data();
        var text = c.text || '';
        var isLong = text.length > COMMENT_CLAMP_LENGTH;
        var textClass = 'blog-comment-text' + (isLong ? ' is-clamped' : '');
        var moreBtn = isLong ? '<button type="button" class="blog-comment-more">Ko‘proq o‘qish</button>' : '';
        return '<div class="blog-comment-item">' +
          '<div class="blog-comment-item-head">' +
            '<span class="blog-comment-author">' + escapeHtml(c.name || 'Anonim') + '</span>' +
            '<span class="blog-comment-date">' + formatDate(c.createdAt) + '</span>' +
          '</div>' +
          '<p class="' + textClass + '">' + escapeHtml(text) + '</p>' +
          moreBtn +
        '</div>';
      }).join('');
    }

    // Read more / show less — delegated so it keeps working after re-renders.
    listEl.addEventListener('click', function (e) {
      var btn = e.target.closest('.blog-comment-more');
      if (!btn) return;
      var textNode = btn.previousElementSibling;
      var nowClamped = textNode.classList.toggle('is-clamped');
      btn.textContent = nowClamped ? 'Ko‘proq o‘qish' : 'Yopish';
    });

    async function loadComments() {
      try {
        var snap = await db.collection('blogs').doc(blogId).collection('comments')
          .orderBy('createdAt', 'desc').get();
        renderComments(snap.docs);
      } catch (err) {
        console.error('Comments load failed:', err);
        renderComments([]);
      }
    }

    formEl.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorEl.hidden = true;

      var typedName = nameEl.value.trim();
      var name = typedName || 'Anonim';
      var text = textEl.value.trim();
      if (!text) {
        errorEl.textContent = 'Izoh matnini kiriting.';
        errorEl.hidden = false;
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Yuborilmoqda…';

      try {
        try {
          if (typedName) localStorage.setItem(NAME_KEY, typedName);
        } catch (e) {}

        await db.collection('blogs').doc(blogId).collection('comments').add({
          name: name,
          text: text,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        textEl.value = '';
        hideForm();
        await loadComments();
      } catch (err) {
        errorEl.textContent = 'Izohni yuborishda xatolik yuz berdi. Qayta urinib ko‘ring.';
        errorEl.hidden = false;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Yuborish';
      }
    });

    sectionEl.hidden = false;
    loadComments();
  }

  loadBlogPost();
})();
</script>
</body>
</html>
