<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin kirish — Djami Lessons</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="auth-body">

<div class="auth-split-wrap">
  <div class="auth-split-left">
    <a href="../index.html" class="brand"><span class="brand-mark brand-mark-logo" data-site-logo><img src="../assets/logo.png" alt="Djami Lessons"></span><span data-site-brand-name>Djami Lessons</span></a>

    <div class="auth-split-hero">
      <h2>Hey There!</h2>
      <p>Boshqaruv panelingizga kirish uchun tizimga kiring.</p>
    </div>

    <p class="auth-split-switch">Faqat administratorlar uchun.</p>
  </div>

  <div class="auth-split-right">
    <h1 class="auth-title">Admin panelga kirish</h1>
    <p class="auth-sub">Faqat administratorlar uchun mo‘ljallangan.</p>

    <form class="auth-form" id="adminLoginForm">
      <label class="field">
        <span>Email</span>
        <input type="email" id="loginEmail" required autocomplete="username">
      </label>
      <label class="field">
        <span>Parol</span>
        <div class="password-field">
          <input type="password" id="loginPassword" required autocomplete="current-password">
          <button type="button" class="pw-toggle" id="pwToggle">Ko‘rsatish</button>
        </div>
      </label>

      <p class="form-error" id="loginError" role="alert" hidden></p>

      <button type="submit" class="btn btn-amber auth-submit" id="loginSubmit">Kirish</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../site-settings.js"></script>
<script>

document.getElementById('pwToggle').addEventListener('click', () => {
  const input = document.getElementById('loginPassword');
  const btn = document.getElementById('pwToggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Yashirish' : 'Ko‘rsatish';
});

// If already signed in as an admin, skip straight to the dashboard.
auth.onAuthStateChanged(async (user) => {
  if(!user) return;
  const adminDoc = await db.collection('admins').doc(user.uid).get();
  if(adminDoc.exists){ window.location.href = 'dashboard_a.html'; }
});

document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmit');
  errorEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Tekshirilmoqda…';

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const adminDoc = await db.collection('admins').doc(cred.user.uid).get();
    if(!adminDoc.exists){
      await auth.signOut();
      errorEl.textContent = 'Bu hisob admin sifatida ro‘yxatdan o‘tmagan.';
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kirish';
      return;
    }
    window.location.href = 'dashboard_a.html';
  } catch(err){
    errorEl.textContent = 'Email yoki parol noto‘g‘ri.';
    errorEl.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Kirish';
  }
});
</script>
<div class="powered-by">
  <span>powered by <b>Djami</b></span>
</div>

</body>
</html>
