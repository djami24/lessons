<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro‘yxatdan o‘tish — Djami Lessons</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon/favicon-16x16.png">
<link rel="apple-touch-icon" href="../assets/favicon/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="auth-body">

<div class="auth-wrap auth-wrap-split">
  <div class="auth-split">

    <div class="auth-split-left">
      <a href="../index.html" class="auth-home-btn">← Bosh sahifa</a>
      <a href="../index.html" class="brand"><span class="brand-mark brand-mark-logo" data-site-logo><img src="../assets/logo.png" alt="Djami Lessons"></span><span data-site-brand-name>Djami Lessons</span></a>

      <div class="auth-split-hero">
        <h2>Assalomu alaykum!</h2>
        <p>Bizga qo‘shiling — talaba profilingizni yarating va ingliz tilini o‘rganishni bugun boshlang.</p>
      </div>

      <p class="auth-split-foot">Hisobingiz bormi? <a href="login.html">Kirish</a></p>
    </div>

    <div class="auth-split-right">
      <h1 class="auth-title">Ro‘yxatdan o‘tish</h1>
      <p class="auth-sub">Talaba profilingizni yarating.</p>

      <form class="auth-form" id="registerForm">
        <label class="field">
          <span>Ismingiz</span>
          <input type="text" id="regName" required autocomplete="name">
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="regEmail" required autocomplete="username">
        </label>
        <label class="field">
          <span>Telefon raqam</span>
          <input type="tel" id="regPhone" placeholder="+998 90 123 45 67" required autocomplete="tel">
        </label>
        <label class="field">
          <span>Parol</span>
          <div class="password-field">
            <input type="password" id="regPassword" required autocomplete="new-password" minlength="6">
            <button type="button" class="pw-toggle" id="pwToggle">Ko‘rsatish</button>
          </div>
        </label>

        <label class="field">
          <span>O‘qish turi</span>
          <div class="student-type-choice" style="display:flex; gap:18px; padding:.4em 0;">
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;">
              <input type="radio" name="regStudentType" value="guruh" checked> Guruhda
            </label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;">
              <input type="radio" name="regStudentType" value="individual"> Individual
            </label>
          </div>
        </label>

        <p class="form-error" id="registerError" role="alert" hidden></p>

        <button type="submit" class="btn btn-amber auth-submit" id="registerSubmit">Ro‘yxatdan o‘tish</button>
      </form>

      <p class="auth-split-foot" style="margin-top:1.4em; color:var(--gray);">Ota-ona sifatida ro‘yxatdan o‘tmoqchimisiz? <a href="../parent/register.html">Shu yerga o‘ting</a></p>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../site-settings.js"></script>
<script>

document.getElementById('pwToggle').addEventListener('click', () => {
  const input = document.getElementById('regPassword');
  const btn = document.getElementById('pwToggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Yashirish' : 'Ko‘rsatish';
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('registerError');
  const submitBtn = document.getElementById('registerSubmit');
  errorEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Yaratilmoqda…';

  const name = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const password = document.getElementById('regPassword').value;
  const studentTypeInput = document.querySelector('input[name="regStudentType"]:checked');
  const studentType = studentTypeInput ? studentTypeInput.value : 'guruh';

  try{
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('students').doc(cred.user.uid).set({
      name: name,
      email: email,
      phone: phone,
      studentType: studentType,
      paymentStatus: 'none',
      progress: {},
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // Faollik jurnaliga yozish
    try {
      await db.collection('activity_log').add({
        role: 'student',
        action: 'register',
        uid: cred.user.uid,
        name: name || email,
        email: email,
        at: firebase.firestore.FieldValue.serverTimestamp(),
        ua: navigator.userAgent
      });
    } catch(e){ /* silent */ }
    window.location.href = 'dashboard.html';
  } catch(err){
    let msg = 'Ro‘yxatdan o‘tishda xatolik yuz berdi. Qayta urinib ko‘ring.';
    // Firebase normally maps these to err.code (e.g. 'auth/email-already-in-use'),
    // but some SDK/network paths only surface the raw server message
    // (e.g. 'EMAIL_EXISTS') without setting err.code — so we check both.
    const code = (err && err.code) || '';
    const raw = (err && err.message) || '';
    if(code === 'auth/email-already-in-use' || raw.includes('EMAIL_EXISTS')){
      msg = 'Bu email allaqachon ro‘yxatdan o‘tgan. Kirish sahifasidan foydalaning.';
    } else if(code === 'auth/weak-password' || raw.includes('WEAK_PASSWORD')){
      msg = 'Parol juda oddiy — kamida 6 ta belgi kiriting.';
    } else if(code === 'auth/invalid-email' || raw.includes('INVALID_EMAIL')){
      msg = 'Email manzil noto‘g‘ri kiritildi.';
    } else if(code === 'auth/network-request-failed' || raw.includes('NETWORK')){
      msg = 'Internet aloqasi bilan muammo. Ulanishni tekshirib, qayta urinib ko‘ring.';
    }
    errorEl.textContent = msg;
    errorEl.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Ro‘yxatdan o‘tish';
  }
});
</script>
</body>
</html>
