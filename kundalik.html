<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kundalik — Uy vazifalari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --bg: #121826;
    --bg-2: #0d121c;
    --panel: #1c2536;
    --panel-2: #212d40;
    --line: #2e3b52;
    --ink: #eef1f0;
    --ink-dim: #93a0b5;
    --brass: #2F6FED;
    --brass-dim: #1E54C4;
    --pass: #5fae95;
    --shadow: 0 24px 50px -25px rgba(0,0,0,0.65);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #182236 0%, var(--bg) 55%, var(--bg-2) 100%);
    color: var(--ink);
    font-family: 'PT Serif', Georgia, serif;
    min-height:100vh;
  }

  /* ---- topbar ---- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:100;
  }
  .topbar-brand{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600; font-size:16px;
    color:var(--brass);
  }
  .topbar-right{
    display:flex; align-items:center; gap:12px;
  }
  .user-chip{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--ink-dim);
    background:var(--panel-2);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 14px;
  }
  .btn-ghost{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:600;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:8px;
    padding:8px 16px;
    cursor:pointer;
    transition:all 0.2s;
  }
  .btn-ghost:hover{ color:var(--ink); border-color:var(--brass-dim); }

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:32px 20px 60px;
  }

  /* ---- Page title ---- */
  .page-head{
    margin-bottom:28px;
  }
  .page-head h1{
    font-family:'IBM Plex Mono', monospace;
    font-size:clamp(20px,4vw,28px);
    margin:0 0 6px;
  }
  .page-head p{
    color:var(--ink-dim); font-size:14px; margin:0;
  }

  /* ---- Back button ---- */
  .back-btn{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; font-weight:600;
    background:transparent;
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:8px;
    padding:8px 16px;
    cursor:pointer;
    transition:all 0.2s;
    margin-bottom:20px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .back-btn:hover{ color:var(--ink); border-color:var(--brass-dim); }

  /* ---- Group folders ---- */
  .groups-heading{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px; color:var(--ink-dim);
    margin:0 0 16px;
    letter-spacing:0.04em;
  }
  .groups-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap:14px;
  }
  .group-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px 20px;
    cursor:pointer;
    transition:all 0.2s;
    display:flex; flex-direction:column; gap:8px;
  }
  .group-card:hover{
    border-color:var(--brass-dim);
    transform:translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .group-card .icon{ font-size:28px; }
  .group-card .name{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600; font-size:15px;
  }
  .group-card .count{
    font-size:12px; color:var(--ink-dim);
  }

  /* ---- Homework cards ---- */
  .hw-heading{
    font-family:'IBM Plex Mono', monospace;
    font-size:14px; color:var(--ink-dim);
    margin:0 0 16px;
    letter-spacing:0.04em;
  }
  .hw-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap:16px;
  }
  .hw-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    transition:all 0.2s;
  }
  .hw-card:hover{
    border-color:var(--brass-dim);
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(0,0,0,0.4);
  }
  .hw-card-date{
    background: var(--brass);
    color:#ffffff;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600; font-size:13px;
    padding:10px 16px;
    letter-spacing:0.03em;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .hw-check{
    background:#08221a; color:var(--pass);
    font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:999px;
    white-space:nowrap;
  }
  .hw-card-body{
    padding:16px;
  }
  .hw-card-title{
    font-weight:700; font-size:16px; margin:0 0 8px;
    line-height:1.4;
  }
  .hw-card-preview{
    font-size:13px; color:var(--ink-dim);
    margin:0;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  /* ---- Modal ---- */
  .modal-bg{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.7);
    display:flex; align-items:center; justify-content:center;
    z-index:200;
    padding:20px;
  }
  .modal-bg[hidden]{ display:none; }
  .modal{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:18px;
    max-width:620px; width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:32px;
    position:relative;
  }
  .modal-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px; color:var(--brass);
    margin:0 0 10px;
    letter-spacing:0.06em;
  }
  .modal-title{
    font-size:22px; font-weight:700;
    margin:0 0 18px;
    line-height:1.35;
  }
  .modal-content{
    font-size:15px; line-height:1.75;
    color:var(--ink);
  }
  .modal-content p{ margin:0 0 12px; }
  .modal-content ul, .modal-content ol{
    padding-left:20px; margin:0 0 12px;
  }
  .modal-content li{ margin-bottom:6px; }
  .modal-close{
    position:absolute; top:18px; right:18px;
    background:var(--panel-2);
    border:1px solid var(--line);
    color:var(--ink-dim);
    border-radius:8px;
    padding:6px 12px;
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    transition:all 0.2s;
  }
  .modal-close:hover{ color:var(--ink); border-color:var(--brass-dim); }

  /* ---- States ---- */
  .loading{
    text-align:center;
    padding:40px;
    color:var(--ink-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
  }
  .empty{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-dim);
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
  }
  .empty .icon{ font-size:36px; margin-bottom:12px; }

  /* ---- Auth loading ---- */
  #authLoading{
    position:fixed; inset:0;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-dim); font-size:14px;
  }
</style>
</head>
<body>

<div id="authLoading">Yuklanmoqda…</div>

<div id="appShell" style="display:none;">

  <div class="topbar">
    <div class="topbar-brand">📅 Kundalik</div>
    <div class="topbar-right">
      <span class="user-chip" id="userChip">…</span>
      <a class="btn-ghost" id="backToProfileBtn" href="student/dashboard.html" style="text-decoration:none; display:inline-flex; align-items:center;">← Talaba profili</a>
    </div>
  </div>

  <div class="wrap">
    <!-- GROUPS VIEW -->
    <div id="viewGroups">
      <div class="page-head">
        <h1>Guruhlar</h1>
        <p>Uy vazifalarini ko'rish uchun guruhingizni tanlang. Diqqat: guruhni faqat bir marta tanlaysiz, keyin uni o'zgartira olmaysiz.</p>
      </div>
      <p class="groups-heading">GURUHLAR</p>
      <div id="groupsGrid" class="groups-grid">
        <div class="loading">Guruhlar yuklanmoqda…</div>
      </div>
    </div>

    <!-- HOMEWORK VIEW -->
    <div id="viewHomework" style="display:none;">
      <button class="back-btn" id="backToGroups">← Guruhlar</button>
      <div class="page-head">
        <h1 id="hwGroupName">Guruh</h1>
        <p>Sanani bosib, uy vazifasini ko'ring</p>
      </div>
      <p class="hw-heading" id="hwCountLabel">UY VAZIFALARI</p>
      <div id="hwGrid" class="hw-grid">
        <div class="loading">Yuklanmoqda…</div>
      </div>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-bg" id="hwModal" hidden>
  <div class="modal">
    <button class="modal-close" id="modalClose">✕ Yopish</button>
    <p class="modal-date" id="modalDate"></p>
    <h2 class="modal-title" id="modalTitle"></h2>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
// auth and db come from firebase-config.js (same Firebase project as
// register.html / dashboard.html, so accounts match up).

function escHtml(s){
  return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDate(ts){
  if(!ts) return '';
  const d = typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('uz-UZ',{day:'numeric',month:'long',year:'numeric'});
}

let currentUid = null;

auth.onAuthStateChanged(async user => {
  document.getElementById('authLoading').style.display = 'none';
  if(!user){
    window.location.href = 'student/login.html';
    return;
  }
  document.getElementById('appShell').style.display = '';
  document.getElementById('userChip').textContent = user.email;
  currentUid = user.uid;
  await initGroupFlow();
});

// A student picks their Kundalik group exactly once. After that, we skip
// the groups list entirely and go straight to their own group's homework —
// other groups are never shown to them again.
async function initGroupFlow(){
  try{
    const studentDoc = await db.collection('students').doc(currentUid).get();
    const kundalikGroup = studentDoc.exists ? studentDoc.data().kundalikGroup : null;
    if(kundalikGroup){
      document.getElementById('backToGroups').style.display = 'none';
      openGroup(kundalikGroup);
      return;
    }
  } catch(err){
    console.error(err);
  }
  loadGroups();
}

// Saves the student's chosen group permanently, then opens it.
async function chooseGroup(groupId){
  try{
    await db.collection('students').doc(currentUid).update({ kundalikGroup: groupId });
  } catch(err){
    console.error(err);
    alert('Guruhni saqlab bo\'lmadi. Internet aloqasini tekshirib, qayta urinib ko\'ring.');
    return;
  }
  document.getElementById('backToGroups').style.display = 'none';
  openGroup(groupId);
}

document.getElementById('backToGroups').addEventListener('click', () => {
  showView('groups');
});

document.getElementById('modalClose').addEventListener('click', () => {
  document.getElementById('hwModal').hidden = true;
});
document.getElementById('hwModal').addEventListener('click', e => {
  if(e.target === document.getElementById('hwModal'))
    document.getElementById('hwModal').hidden = true;
});

function showView(name){
  document.getElementById('viewGroups').style.display = name === 'groups' ? '' : 'none';
  document.getElementById('viewHomework').style.display = name === 'homework' ? '' : 'none';
}

/* ---- Groups ---- */
async function loadGroups(){
  const grid = document.getElementById('groupsGrid');
  grid.innerHTML = '<div class="loading">Guruhlar yuklanmoqda…</div>';
  try{
    const snap = await db.collection('kundalik').get();
    if(snap.empty){
      grid.innerHTML = '<div class="empty"><div class="icon">📂</div>Hali guruhlar qo\'shilmagan.</div>';
      return;
    }
    // Each doc = one group, doc id = group name
    const groups = snap.docs.map(d => ({id:d.id, ...d.data()}));
    grid.innerHTML = groups.map(g => `
      <div class="group-card" data-gid="${escHtml(g.id)}">
        <div class="icon">📁</div>
        <div class="name">${escHtml(g.name || g.id)}</div>
        <div class="count">Bosing →</div>
      </div>
    `).join('');
    grid.querySelectorAll('.group-card').forEach(card => {
      card.addEventListener('click', () => chooseGroup(card.dataset.gid));
    });
  } catch(err){
    grid.innerHTML = '<div class="empty"><div class="icon">⚠️</div>Yuklab bo\'lmadi.</div>';
    console.error(err);
  }
}

/* ---- Homework list ---- */
async function openGroup(groupId){
  showView('homework');
  document.getElementById('hwGroupName').textContent = groupId;
  const grid = document.getElementById('hwGrid');
  const countLabel = document.getElementById('hwCountLabel');
  grid.innerHTML = '<div class="loading">Yuklanmoqda…</div>';

  try{
    const snap = await db.collection('kundalik').doc(groupId)
      .collection('vazifalari').orderBy('sana', 'desc').get();

    if(snap.empty){
      grid.innerHTML = '<div class="empty"><div class="icon">📭</div>Hali uy vazifalari qo\'shilmagan.</div>';
      countLabel.textContent = 'UY VAZIFALARI (0)';
      return;
    }

    countLabel.textContent = `UY VAZIFALARI (${snap.docs.length})`;
    const now = new Date();
    grid.innerHTML = snap.docs.map(doc => {
      const d = doc.data();
      const dateStr = formatDate(d.sana);
      const title = escHtml(d.sarlavha || 'Uy vazifasi');
      const preview = escHtml(
        (d.matn || '').replace(/<[^>]*>/g,'').substring(0, 120)
      );
      const dueDate = d.sana ? (typeof d.sana.toDate === 'function' ? d.sana.toDate() : new Date(d.sana)) : null;
      const isPast = dueDate ? dueDate < now : false;
      return `
        <div class="hw-card" data-id="${doc.id}" data-gid="${escHtml(groupId)}">
          <div class="hw-card-date">📅 ${dateStr}${isPast ? ' <span class="hw-check" title="Muddati o\'tgan — tekshirilgan">✓ Tekshirilgan</span>' : ''}</div>
          <div class="hw-card-body">
            <p class="hw-card-title">${title}</p>
            <p class="hw-card-preview">${preview}</p>
          </div>
        </div>
      `;
    }).join('');

    // Cache docs for modal
    window._hwDocs = {};
    snap.docs.forEach(doc => { window._hwDocs[doc.id] = doc.data(); });

    grid.querySelectorAll('.hw-card').forEach(card => {
      card.addEventListener('click', () => openHwModal(card.dataset.id, card.dataset.gid));
    });
  } catch(err){
    grid.innerHTML = '<div class="empty"><div class="icon">⚠️</div>Yuklab bo\'lmadi.</div>';
    console.error(err);
  }
}

/* ---- Homework modal ---- */
function openHwModal(docId, groupId){
  const d = (window._hwDocs || {})[docId];
  if(!d) return;
  document.getElementById('modalDate').textContent = '📅 ' + formatDate(d.sana);
  document.getElementById('modalTitle').textContent = d.sarlavha || 'Uy vazifasi';
  // d.matn may contain rich HTML from the admin panel
  document.getElementById('modalContent').innerHTML = d.matn || '';
  document.getElementById('hwModal').hidden = false;
}
</script>
</body>
</html>
