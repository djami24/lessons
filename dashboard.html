<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mening papkam — English Folder</title>
<link rel="stylesheet" href="../style.css">
</head>
<body>

<div id="loadingScreen" class="loading-screen">Yuklanmoqda…</div>

<div class="admin-shell" id="appShell" hidden>

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <a href="../index.html" class="brand"><span class="brand-mark"></span>English Folder</a>
    <ul class="admin-nav">
      <li><a href="#" class="active">📁 Mening papkam</a></li>
      <li><a href="../index.html" target="_blank">🌐 Saytni ko‘rish</a></li>
    </ul>
    <div class="admin-user">
      <div>
        <div class="admin-user-name" id="sidebarUsername">o‘quvchi</div>
        <div class="admin-user-role">O‘quvchi</div>
      </div>
      <button class="logout-btn" id="logoutBtn">Chiqish</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">

    <section id="view-noFolder" hidden>
      <div class="empty-state">
        <h3>Sizga hali papka biriktirilmagan</h3>
        <p>O‘qituvchingizga murojaat qiling — u sizni tegishli guruh papkasiga biriktiradi.</p>
      </div>
    </section>

    <section id="view-folder" hidden>
      <div class="admin-header">
        <div>
          <h1 id="folderName">Papka nomi</h1>
          <p id="folderSub">12 darslik dastur</p>
        </div>
      </div>

      <div class="folder-progress-bar" style="margin-bottom:2em;">
        <div class="folder-progress-fill" id="progressFill" style="width:0%"></div>
      </div>

      <div class="lesson-list" id="lessonList"></div>
    </section>

  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
const LESSON_COUNT = 12;
const STATUS_LABELS = { kutilmoqda: 'Kutilmoqda', tayyor: 'Tayyor', otildi: 'O‘tildi' };

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

auth.onAuthStateChanged(async (user) => {
  if(!user){ window.location.href = 'login.html'; return; }

  const studentDoc = await db.collection('students').doc(user.uid).get();
  if(!studentDoc.exists){
    await auth.signOut();
    window.location.href = 'login.html';
    return;
  }
  const student = studentDoc.data();
  document.getElementById('sidebarUsername').textContent = student.name || student.email;
  document.getElementById('loadingScreen').hidden = true;
  document.getElementById('appShell').hidden = false;

  if(!student.folderId){
    document.getElementById('view-noFolder').hidden = false;
    return;
  }

  const folderDoc = await db.collection('folders').doc(student.folderId).get();
  if(!folderDoc.exists){
    document.getElementById('view-noFolder').hidden = false;
    return;
  }

  const folder = folderDoc.data();
  renderFolder(folder);
});

function renderFolder(folder){
  document.getElementById('folderName').textContent = folder.name;
  const done = folder.lessons.filter(l => l.status === 'otildi').length;
  document.getElementById('folderSub').textContent = `${folder.level} · ${done}/${LESSON_COUNT} dars o‘tildi`;
  document.getElementById('progressFill').style.width = Math.round((done / LESSON_COUNT) * 100) + '%';

  const lessonList = document.getElementById('lessonList');
  lessonList.innerHTML = folder.lessons.map(lesson => {
    const isLocked = lesson.status === 'kutilmoqda' || lesson.title.trim() === '';
    const hasTitle = lesson.title.trim() !== '';

    if(isLocked){
      return `
        <div class="lesson-row lesson-locked">
          <div class="lesson-index">${String(lesson.index).padStart(2,'0')}</div>
          <div class="lesson-main">
            <div class="lesson-row-top">
              <span class="lesson-title placeholder">🔒 Dars ${lesson.index} — hali ochilmagan</span>
            </div>
            <div class="lesson-meta">
              <span class="status-pill status-kutilmoqda">Kutilmoqda</span>
            </div>
          </div>
        </div>`;
    }

    return `
      <div class="lesson-row">
        <div class="lesson-index">${String(lesson.index).padStart(2,'0')}</div>
        <div class="lesson-main">
          <div class="lesson-row-top">
            <span class="lesson-title">${escapeHtml(lesson.title)}</span>
          </div>
          <div class="lesson-meta">
            <span class="status-pill status-${lesson.status}">${STATUS_LABELS[lesson.status]}</span>
          </div>
          <div class="lesson-links">
            ${lesson.video ? `<a href="${escapeHtml(lesson.video)}" target="_blank" rel="noopener">🎬 Video darsni ko‘rish</a>` : ''}
            ${lesson.material ? `<a href="${escapeHtml(lesson.material)}" target="_blank" rel="noopener">📎 Materialni yuklab olish</a>` : ''}
          </div>
          ${lesson.homework ? `<div class="lesson-homework"><strong>📝 Uy vazifasi:</strong> ${escapeHtml(lesson.homework)}</div>` : ''}
        </div>
      </div>`;
  }).join('');

  document.getElementById('view-folder').hidden = false;
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  if(confirm('Tizimdan chiqmoqchimisiz?')) auth.signOut().then(() => window.location.href = 'login.html');
});
</script>
</body>
</html>
