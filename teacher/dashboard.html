<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ustoz paneli — Djami Lessons</title>
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="stylesheet" href="../style.css">
<style>
  body{margin:0;background:#f4f6fb;color:#1a2238;font-family:Inter,system-ui,sans-serif;}
  .t-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;background:#fff;border-bottom:1px solid #e3e7f0;}
  .t-top b{font-size:1.05rem;}
  .t-wrap{max-width:960px;margin:0 auto;padding:26px 20px 60px;}
  .t-wrap h1{font-size:1.45rem;margin:0 0 4px;}
  .t-sub{color:#6b7488;font-size:.9rem;margin:0 0 20px;}
  .t-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .t-card{background:#fff;border:1.5px solid #e3e7f0;border-radius:16px;padding:18px;}
  .t-card h3{margin:0 0 6px;font-size:1.05rem;}
  .t-card p{margin:0;color:#6b7488;font-size:.85rem;}
  .t-note{margin-top:22px;padding:12px 14px;border-radius:12px;background:#eaf1ff;color:#2f5fc4;font-size:.88rem;}
  #tLoading{padding:60px;text-align:center;color:#6b7488;}
</style>
</head>
<body>
<div id="tLoading">Yuklanmoqda…</div>
<div id="tApp" hidden>
  <div class="t-top">
    <b id="tName">Ustoz</b>
    <button class="btn btn-ghost btn-sm" id="tLogout">Chiqish</button>
  </div>
  <div class="t-wrap">
    <h1>Mening guruhlarim</h1>
    <p class="t-sub">Administrator sizga biriktirgan guruhlar.</p>
    <div class="t-grid" id="tGroups"></div>
    <div class="t-note">Guruh, talaba, davomat va statistika bo'limlari keyingi bosqichda shu yerga qo'shiladi.</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script>
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
auth.onAuthStateChanged(async (user) => {
  if (!user) { location.href = 'login.html'; return; }
  const t = await db.collection('teachers').doc(user.uid).get();
  if (!t.exists || t.data().active === false) { await auth.signOut(); location.href = 'login.html'; return; }
  document.getElementById('tName').textContent = t.data().name || user.email;
  document.getElementById('tLoading').hidden = true;
  document.getElementById('tApp').hidden = false;
  const box = document.getElementById('tGroups');
  try {
    const snap = await db.collection('oquv_groups').where('teacherId', '==', user.uid).get();
    if (snap.empty) { box.innerHTML = '<p class="t-sub">Sizga hali guruh biriktirilmagan.</p>'; return; }
    box.innerHTML = snap.docs.map(d => { const g = d.data(); return '<div class="t-card"><h3>' + esc(g.name) + '</h3><p>' + esc(g.time || '') + '</p></div>'; }).join('');
  } catch (e) { box.innerHTML = '<p class="t-sub">Guruhlarni yuklab bo\'lmadi.</p>'; }
});
document.getElementById('tLogout').addEventListener('click', async () => { await auth.signOut(); location.href = 'login.html'; });
</script>
</body>
</html>
