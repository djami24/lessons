<style id="authBgCss">
/* Bosh sahifadagi kabi oppoq fon + CursorGrid (cursor-grid-bg.js).
   Selektorlar glass-auth.css dagi !important qoidalardan kuchliroq qilib yozilgan. */
html:has(body.auth-body){background:#ffffff !important;background-image:none !important}
html body.auth-body.auth-body.auth-body.auth-body{background:transparent !important;background-image:none !important}
html body.auth-body.auth-body.auth-body.auth-body::before,html body.auth-body.auth-body.auth-body.auth-body::after{display:none !important;content:none !important}
/* To'liq ekranli qatlamlar (ko'k chap panel, o'ng oynali panel) shaffof: panjara ko'rinadi */
html body.auth-body.auth-body.auth-body.auth-body :is(.auth-wrap,.auth-wrap-split,.auth-split-wrap,.auth-split,.auth-split-left,.auth-split-right){
  background:transparent !important;background-image:none !important;box-shadow:none !important;
  -webkit-backdrop-filter:none !important;backdrop-filter:none !important;animation:none !important}
html body.auth-body.auth-body.auth-body.auth-body :is(.auth-wrap,.auth-wrap-split,.auth-split-wrap,.auth-split,.auth-split-left,.auth-split-right)::before,
html body.auth-body.auth-body.auth-body.auth-body :is(.auth-wrap,.auth-wrap-split,.auth-split-wrap,.auth-split,.auth-split-left,.auth-split-right)::after,
html body.auth-body.auth-body.auth-body.auth-body .auth-split-hero::after{display:none !important;content:none !important;animation:none !important}
/* Chap tomon: faqat sarlavha, matnlar to'q rangda */
html body.auth-body.auth-body.auth-body.auth-body .auth-split-left{color:#14213d !important}
html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .auth-split-hero h2{color:#14213d !important}
html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .brand,html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .brand span{color:#14213d !important}
html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .auth-home-btn{color:#14213d !important;background:rgba(255,255,255,.7) !important;border:1px solid rgba(20,33,61,.22) !important}
html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .auth-split-foot,html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .auth-split-switch{color:#6b7487 !important}
html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .auth-split-foot a{color:#1d4fd1 !important}
</style>
<style id="authBlackCss">
/* Talaba kirish: tugmalar qora, matnlar qora */
html body.auth-body.auth-body.auth-body.auth-body :is(.auth-title,.auth-sub,.field>span,.auth-remember-row label,.auth-forgot,.pw-toggle,.auth-split-left .brand,.auth-split-left .brand span,.auth-split-hero h2){color:#111111 !important}
html body.auth-body.auth-body.auth-body.auth-body .field input{color:#111111 !important}
html body.auth-body.auth-body.auth-body.auth-body .auth-remember-row input{accent-color:#111111}
html body.auth-body.auth-body.auth-body.auth-body :is(.auth-submit){background:#111111 !important;background-image:none !important;border:1px solid #111111 !important;color:#ffffff !important;box-shadow:none !important}
html body.auth-body.auth-body.auth-body.auth-body :is(.auth-submit):hover{background:#2b2b2b !important;border-color:#2b2b2b !important;color:#ffffff !important}
</style>
<style id="authHomeBtnCss">

html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .auth-home-btn{
  width:44px !important;height:44px !important;min-width:0 !important;padding:0 !important;margin:0 0 18px !important;
  display:inline-flex !important;align-items:center !important;justify-content:center !important;
  border-radius:12px !important;background:#ffffff !important;background-image:none !important;
  border:1px solid #e6e8ef !important;color:#111111 !important;
  box-shadow:0 1px 2px rgba(20,33,61,.06) !important;font-size:0 !important;line-height:0 !important}
html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .auth-home-btn:hover{background:#f4f5f9 !important;border-color:#d5d9e4 !important;color:#111111 !important}
html body.auth-body.auth-body.auth-body.auth-body .auth-split-left .auth-home-btn svg{display:block;width:20px;height:20px}
</style>
<style id="authFontCss">
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

body {
  font-family: 'Inter', sans-serif;
}

h1, h2, .heading {
  font-family: 'Manrope', sans-serif;
}

/* Quyidagilar yuqoridagi qoidalar style.css / glass-auth.css ustidan kuchga kirishi uchun */

html body.auth-body.auth-body.auth-body :is(input,button,select,textarea,label,p,a,span,div){font-family:'Inter',sans-serif !important}
html body.auth-body.auth-body.auth-body :is(h1,h2,.heading,.auth-title){font-family:'Manrope',sans-serif !important}

<body class="auth-body">

<div class="auth-wrap auth-wrap-split">
  <div class="auth-split">

    <div class="auth-split-left">
      <a href="../index.html" class="auth-home-btn" aria-label="Bosh sahifa" title="Bosh sahifa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
      <a href="../index.html" class="brand"><span class="brand-mark brand-mark-logo" data-site-logo><img src="../assets/logo.png" alt="Djami Lessons"></span><span data-site-brand-name>Djami Lessons</span></a>
    </div>

    <div class="auth-split-right">
      <h1 class="auth-title">Talaba profiliga kirish</h1>
      <p class="auth-sub">Email va parolingizni kiriting.</p>

      <form class="auth-form" id="studentLoginForm">
        <label class="field">
          <span>Email</span>
          <input type="email" id="loginEmail" required autocomplete="username">
        </label>
        <label class="field">
          <span>Parol</span>
          <div class="password-field">
            <input type="password" id="loginPassword" required autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle">Ko‘rsatish</button>
          </div>
        </label>

        <div class="auth-remember-row">
          <label><input type="checkbox" id="keepLoggedIn" checked> Meni eslab qol</label>
          <a href="#" class="auth-forgot" id="forgotPasswordLink">Parolni unutdingizmi?</a>
        </div>

        <p class="form-error" id="loginError" role="alert" hidden></p>
        <p class="form-notice" id="loginNotice" role="status" hidden></p>

        <button type="submit" class="btn btn-amber auth-submit" id="loginSubmit">Kirish</button>
      </form>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../site-settings.js"></script>
<script>

document.getElementById('pwToggle').addEventListener('click', () => {
  const input = document.getElementById('loginPassword');
  const btn = document.getElementById('pwToggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Yashirish' : 'Ko‘rsatish';
});

// Agar oldin "Meni eslab qol" belgilangan bo'lsa, Firebase brauzerda
// sessiyani saqlab qoladi. Shunday holatda talabani qayta email/parol
// so'ramasdan avtomatik ravishda dashboard'ga o'tkazamiz.
const authForm = document.getElementById('studentLoginForm');
const autoLoginNotice = document.getElementById('loginNotice');
auth.onAuthStateChanged(async (user) => {
  if(!user) return;
  try{
    const studentDoc = await db.collection('students').doc(user.uid).get();
    if(studentDoc.exists){
      authForm.hidden = true;
      autoLoginNotice.textContent = 'Avvalgi profilingizga avtomatik kirilmoqda…';
      autoLoginNotice.hidden = false;
      window.location.href = 'dashboard.html';
    }
    // Agar bu hisob talaba sifatida ro'yxatdan o'tmagan bo'lsa (masalan,
    // ota-ona sifatida kirgan), forma oddiy holatda ko'rsatilaveradi.
  } catch(e){ /* silent — forma ko'rsatilaveradi */ }
});

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  const noticeEl = document.getElementById('loginNotice');
  const submitBtn = document.getElementById('loginSubmit');
  errorEl.hidden = true;
  noticeEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Tekshirilmoqda…';

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const keepLoggedIn = document.getElementById('keepLoggedIn').checked;

  try{
    // "Meni eslab qol" belgilansa, sessiya brauzer yopilgandan keyin ham
    // saqlanadi; belgilanmasa, faqat shu tab/sessiya davomida amal qiladi.
    await auth.setPersistence(
      keepLoggedIn ? firebase.auth.Auth.Persistence.LOCAL : firebase.auth.Auth.Persistence.SESSION
    );
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const studentDoc = await db.collection('students').doc(cred.user.uid).get();
    if(!studentDoc.exists){
      await auth.signOut();
      errorEl.textContent = 'Bu hisob talaba sifatida ro‘yxatdan o‘tmagan.';
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kirish';
      return;
    }
    // Faollik jurnaliga yozish
    try {
      await db.collection('activity_log').add({
        role: 'student',
        action: 'login',
        uid: cred.user.uid,
        name: studentDoc.data().name || cred.user.email || '—',
        email: cred.user.email || '—',
        at: firebase.firestore.FieldValue.serverTimestamp(),
        ua: navigator.userAgent
      });
    } catch(e){ /* silent */ }
    window.location.href = 'dashboard.html';
  } catch(err){
    errorEl.textContent = 'Email yoki parol noto‘g‘ri.';
    errorEl.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Kirish';
  }
});

document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  const noticeEl = document.getElementById('loginNotice');
  errorEl.hidden = true;
  noticeEl.hidden = true;

  const email = document.getElementById('loginEmail').value.trim();
  if(!email){
    errorEl.textContent = 'Parolni tiklash uchun avval email manzilingizni kiriting.';
    errorEl.hidden = false;
    return;
  }

  try{
    await auth.sendPasswordResetEmail(email);
    noticeEl.textContent = 'Parolni tiklash havolasi ' + email + ' manziliga yuborildi.';
    noticeEl.hidden = false;
  } catch(err){
    errorEl.textContent = 'Havolani yuborib bo‘lmadi. Email manzilni tekshirib, qayta urinib ko‘ring.';
    errorEl.hidden = false;
  }
});
</script>
