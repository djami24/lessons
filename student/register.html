<style>
  .avatar-choice{ display:flex; gap:12px; flex-wrap:wrap; padding:.3em 0; }
  .avatar-choice label{
    position:relative; display:flex; flex-direction:column; align-items:center; gap:8px;
    width:96px; padding:10px 6px; border:2px solid var(--line, #e2e6ee); border-radius:18px;
    cursor:pointer; font-weight:600; font-size:.82rem; color:var(--gray, #6b7487);
    transition:border-color .15s, box-shadow .15s, color .15s;
  }
  .avatar-choice label:hover{ border-color:#9db8f5; }
  .avatar-choice input{ position:absolute; opacity:0; width:1px; height:1px; pointer-events:none; }
  .avatar-choice img{ width:72px; height:72px; border-radius:50%; object-fit:cover; display:block; }
  .avatar-choice label:has(input:checked){ border-color:#2f6fed; box-shadow:0 0 0 3px rgba(47,111,237,.18); color:#2f6fed; }
  .avatar-choice label:has(input:focus-visible){ outline:2px solid #2f6fed; outline-offset:2px; }
  .avatar-choice.is-invalid label{ border-color:#d64545; }
  #pepeCard{ width:128px; }
  .avatar-hint{ margin:.2em 0 0; font-weight:400; font-size:.8rem; color:var(--gray, #6b7487); }
</style>

<body class="auth-body">

<div class="auth-wrap auth-wrap-split">
  <div class="auth-split">

    <div class="auth-split-left">
      <a href="../index.html" class="auth-home-btn" aria-label="Bosh sahifa" title="Bosh sahifa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg></a>
      <a href="../index.html" class="brand"><span class="brand-mark brand-mark-logo" data-site-logo><img src="../assets/logo.png" alt="Djami Lessons"></span><span data-site-brand-name>Djami Lessons</span></a>

      <div class="auth-split-hero">
        <h2>Assalomu alaykum!</h2>
      </div>
    </div>

    <div class="auth-split-right">
      <h1 class="auth-title">Ro‘yxatdan o‘tish</h1>
      <p class="auth-sub">Talaba profilingizni yarating.</p>

      <form class="auth-form" id="registerForm">
        <label class="field">
          <span>Ismingiz</span>
          <input type="text" id="regFirstName" required autocomplete="given-name">
        </label>
        <label class="field">
          <span>Familiyangiz</span>
          <input type="text" id="regLastName" required autocomplete="family-name">
        </label>
        <div class="field" id="dobField">
          <span>Tug‘ilgan sana</span>
          <div class="dob-row">
            <select id="regBirthDay" required aria-label="Kun"><option value="" selected disabled>Kun</option></select>
            <select id="regBirthMonth" required aria-label="Oy"><option value="" selected disabled>Oy</option></select>
            <select id="regBirthYear" required aria-label="Yil"><option value="" selected disabled>Yil</option></select>
          </div>
        </div>
        <label class="field">
          <span>Telefon raqam</span>
          <input type="tel" id="regPhone" placeholder="+998 90 123 45 67" required autocomplete="tel">
        </label>
        <label class="field">
          <span>Email</span>
          <input type="email" id="regEmail" required autocomplete="username">
        </label>
        <label class="field">
          <span>Parol</span>
          <div class="password-field">
            <input type="password" id="regPassword" required autocomplete="new-password" minlength="6">
            <button type="button" class="pw-toggle" id="pwToggle">Ko‘rsatish</button>
          </div>
        </label>

        <label class="field">
          <span>O‘qish turi</span>
          <div class="student-type-choice" style="display:flex; gap:18px; padding:.4em 0;">
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;">
              <input type="radio" name="regStudentType" value="guruh" checked> Guruhda
            </label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:400; cursor:pointer;">
              <input type="radio" name="regStudentType" value="individual"> Individual
            </label>
          </div>
        </label>

        <div class="field" id="avatarField">
          <span>Profil rasmingiz <b style="color:#d64545;">*</b></span>
          <div class="avatar-choice" id="avatarChoice" role="radiogroup" aria-label="Profil rasmi"></div>
        </div>

        <p class="form-error" id="registerError" role="alert" hidden></p>

        <button type="submit" class="btn btn-amber auth-submit" id="registerSubmit">Ro‘yxatdan o‘tish</button>
      </form>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>

<script>
// Tug'ilgan sana: kun / oy / yil ro'yxatlari
(function(){
  const d = document.getElementById('regBirthDay');
  const m = document.getElementById('regBirthMonth');
  const y = document.getElementById('regBirthYear');
  if(!d || !m || !y) return;
  for(let i = 1; i <= 31; i++) d.add(new Option(String(i), String(i)));
  ['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr']
    .forEach((name, idx) => m.add(new Option(name, String(idx + 1))));
  const now = new Date().getFullYear();
  for(let yr = now - 4; yr >= now - 80; yr--) y.add(new Option(String(yr), String(yr)));
})();
</script>
<script>

// Avatarlar ro'yxati ../avatars.js faylida
(function(){
  const base = '../assets/';
  const list = window.AVATAR_LIST || [];
  const pepes = list.filter(a => a.group === 'pepe' && !a.hidden);
  const card = (a, extra) => '<label' + (extra || '') + '><input type="radio" name="regAvatar" value="' + a.key + '">' +
    '<img src="' + base + a.file + '" alt="" onerror="this.style.visibility=\'hidden\'"><span>' + a.label + '</span></label>';
  let html = '';
  if(pepes.length) html += card(Object.assign({}, pepes[0], { label: 'Profil rasmlari' }), ' id="pepeCard"');
  document.getElementById('avatarChoice').innerHTML = html;

  // "Profil rasmlari" kartochkasi bosilganda hamma pepe rasmlari oynada chiqadi, talaba bittasini tanlaydi
  const pepeCard = document.getElementById('pepeCard');
  if(pepeCard){
    const radio = pepeCard.querySelector('input');
    const img = pepeCard.querySelector('img');
    pepeCard.addEventListener('click', (e) => {
      e.preventDefault();
      openAvatarGallery({
        group: 'pepe', base: base, title: 'Profil rasmini tanlang',
        selected: radio.checked ? radio.value : '',
        onPick: (key, src) => {
          radio.value = key; img.src = src; img.style.visibility = '';
          radio.checked = true;
          radio.dispatchEvent(new Event('change', { bubbles: true }));
        }
      });
    });
  }
})();
document.querySelectorAll('input[name="regAvatar"]').forEach(r => r.addEventListener('change', () => {
  document.getElementById('avatarChoice').classList.remove('is-invalid');
  document.getElementById('registerError').hidden = true;
}));

document.getElementById('pwToggle').addEventListener('click', () => {
  const input = document.getElementById('regPassword');
  const btn = document.getElementById('pwToggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Yashirish' : 'Ko‘rsatish';
});

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('registerError');
  const submitBtn = document.getElementById('registerSubmit');
  errorEl.hidden = true;

  // Tug'ilgan sana: haqiqiy sana bo'lishi kerak (masalan, 31-fevral emas)
  const bDay = parseInt(document.getElementById('regBirthDay').value, 10);
  const bMonth = parseInt(document.getElementById('regBirthMonth').value, 10);
  const bYear = parseInt(document.getElementById('regBirthYear').value, 10);
  const bCheck = new Date(bYear, bMonth - 1, bDay);
  if(!bDay || !bMonth || !bYear || bCheck.getFullYear() !== bYear || bCheck.getMonth() !== bMonth - 1 || bCheck.getDate() !== bDay){
    errorEl.textContent = 'Iltimos, tug‘ilgan sanangizni to‘g‘ri tanlang.';
    errorEl.hidden = false;
    document.getElementById('dobField').scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  const birthDate = bYear + '-' + String(bMonth).padStart(2, '0') + '-' + String(bDay).padStart(2, '0');

  // Profil rasmi majburiy
  const avatarInput = document.querySelector('input[name="regAvatar"]:checked');
  const avatarBox = document.getElementById('avatarChoice');
  if(!avatarInput){
    avatarBox.classList.add('is-invalid');
    errorEl.textContent = 'Iltimos, profil rasmingizni tanlang.';
    errorEl.hidden = false;
    document.getElementById('avatarField').scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  avatarBox.classList.remove('is-invalid');

  submitBtn.disabled = true;
  submitBtn.textContent = 'Yaratilmoqda…';

  const firstName = document.getElementById('regFirstName').value.trim();
  const lastName = document.getElementById('regLastName').value.trim();
  const name = (firstName + ' ' + lastName).trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const password = document.getElementById('regPassword').value;
  const studentTypeInput = document.querySelector('input[name="regStudentType"]:checked');
  const studentType = studentTypeInput ? studentTypeInput.value : 'guruh';
  const avatarImg = avatarInput.value;

  try{
    const cred = await auth.createUserWithEmailAndPassword(email, password);
    await db.collection('students').doc(cred.user.uid).set({
      name: name,
      firstName: firstName,
      lastName: lastName,
      birthDate: birthDate,
      email: email,
      phone: phone,
      studentType: studentType,
      avatarImg: avatarImg,
      avatarEmoji: '',
      paymentStatus: 'none',
      progress: {},
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // Faollik jurnaliga yozish
    try {
      await db.collection('activity_log').add({
        role: 'student',
        action: 'register',
        uid: cred.user.uid,
        name: name || email,
        email: email,
        at: firebase.firestore.FieldValue.serverTimestamp(),
        ua: navigator.userAgent
      });
    } catch(e){ /* silent */ }
    window.location.href = 'dashboard.html';
  } catch(err){
    let msg = 'Ro‘yxatdan o‘tishda xatolik yuz berdi. Qayta urinib ko‘ring.';
    // Firebase normally maps these to err.code (e.g. 'auth/email-already-in-use'),
    // but some SDK/network paths only surface the raw server message
    // (e.g. 'EMAIL_EXISTS') without setting err.code — so we check both.
    const code = (err && err.code) || '';
    const raw = (err && err.message) || '';
    if(code === 'auth/email-already-in-use' || raw.includes('EMAIL_EXISTS')){
      msg = 'Bu email allaqachon ro‘yxatdan o‘tgan. Kirish sahifasidan foydalaning.';
    } else if(code === 'auth/weak-password' || raw.includes('WEAK_PASSWORD')){
      msg = 'Parol juda oddiy — kamida 6 ta belgi kiriting.';
    } else if(code === 'auth/invalid-email' || raw.includes('INVALID_EMAIL')){
      msg = 'Email manzil noto‘g‘ri kiritildi.';
    } else if(code === 'auth/network-request-failed' || raw.includes('NETWORK')){
      msg = 'Internet aloqasi bilan muammo. Ulanishni tekshirib, qayta urinib ko‘ring.';
    }
    errorEl.textContent = msg;
    errorEl.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Ro‘yxatdan o‘tish';
  }
});
</script>
