<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talaba kirish — English Folder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Manrope:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body class="auth-body">

<a href="../index.html" class="brand auth-brand"><span class="brand-mark" data-site-logo></span><span data-site-brand-name>English Folder</span></a>

<div class="auth-wrap">
  <div class="folder auth-folder" style="--tab-color:#2E6F6E">
    <div class="folder-tab"></div>
    <div class="folder-body auth-card">
      <h1 class="auth-title">Talaba profiliga kirish</h1>
      <p class="auth-sub">Email va parolingizni kiriting.</p>

      <form class="auth-form" id="studentLoginForm">
        <label class="field">
          <span>Email</span>
          <input type="email" id="loginEmail" required autocomplete="username">
        </label>
        <label class="field">
          <span>Parol</span>
          <div class="password-field">
            <input type="password" id="loginPassword" required autocomplete="current-password">
            <button type="button" class="pw-toggle" id="pwToggle">Ko‘rsatish</button>
          </div>
        </label>

        <p class="form-error" id="loginError" role="alert" hidden></p>

        <button type="submit" class="btn btn-amber auth-submit" id="loginSubmit">Kirish</button>
      </form>

      <p class="auth-switch">Hisobingiz yo‘qmi? <a href="register.html">Ro‘yxatdan o‘ting</a></p>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="../firebase-config.js"></script>
<script src="../site-settings.js"></script>
<script>

document.getElementById('pwToggle').addEventListener('click', () => {
  const input = document.getElementById('loginPassword');
  const btn = document.getElementById('pwToggle');
  const show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.textContent = show ? 'Yashirish' : 'Ko‘rsatish';
});

// If already signed in as a student, skip straight to the dashboard.
auth.onAuthStateChanged(async (user) => {
  if(!user) return;
  const studentDoc = await db.collection('students').doc(user.uid).get();
  if(studentDoc.exists){ window.location.href = 'dashboard.html'; }
});

document.getElementById('studentLoginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmit');
  errorEl.hidden = true;
  submitBtn.disabled = true;
  submitBtn.textContent = 'Tekshirilmoqda…';

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  try{
    const cred = await auth.signInWithEmailAndPassword(email, password);
    const studentDoc = await db.collection('students').doc(cred.user.uid).get();
    if(!studentDoc.exists){
      await auth.signOut();
      errorEl.textContent = 'Bu hisob talaba sifatida ro‘yxatdan o‘tmagan.';
      errorEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Kirish';
      return;
    }
    window.location.href = 'dashboard.html';
  } catch(err){
    errorEl.textContent = 'Email yoki parol noto‘g‘ri.';
    errorEl.hidden = false;
    submitBtn.disabled = false;
    submitBtn.textContent = 'Kirish';
  }
});
</script>
</body>
</html>
